# Codex layer: what differs from the tool-neutral subagents/<name>.md for Codex.
# One block per agent; each key becomes `key = "value"` in ~/.codex/agents/<agent>.toml.
# Anthropic model names mean nothing to Codex, so no agent sets `model` and Codex uses its
# own default; add `model: <id>` to an agent's block to pin one. Codex has no per-agent
# tool list, only a sandbox.
#
# `skip: true` in an agent's block keeps it out of Codex entirely: nothing is generated, and
# a file this script generated earlier is removed. Add it to turn one off, for example:
#   powershell-expert:
#     skip: true
#
# Existing files in ~/.codex/agents that this script did not generate are never
# touched, so an agent with its own Codex file already is left as it is.

accessibility-tester:
  sandbox_mode: read-only
architect-reviewer:
  sandbox_mode: read-only
code-reviewer:
  sandbox_mode: read-only
research-analyst:
  sandbox_mode: read-only
security-auditor:
  sandbox_mode: read-only
